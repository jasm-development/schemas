name: Auto Assign
on:
    issues:
        types: [opened, unassigned]
    pull_request:
        types: [opened, unassigned]
jobs:
    run:
        runs-on: ubuntu-latest
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: 'Auto-assign issue'
              uses: pozil/auto-assign-issue@v1
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  assignees: JoBeGaming
